# Fly.io app config for domainmate.fly.dev.
app = "domainmate"
primary_region = "iad"

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

# SQLite (server/favorites.js) is a single file with no multi-writer support,
# so this app must stay on exactly one machine/volume - do not `fly scale count`
# above 1 without first moving favorites to a real hosted database.
# One-time setup: fly volumes create domainmate_data -r iad -n 1
[mounts]
  source = "domainmate_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
